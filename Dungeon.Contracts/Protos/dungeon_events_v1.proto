syntax = "proto3";

package dungeon.events.v1;

option csharp_namespace = "Dungeon.Contracts.Events.V1";

// Transport-neutral envelope. Brokers carry its serialized bytes unchanged.
message MessageEnvelopeMessage {
  string message_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  string type = 4;
  int32 version = 5;
  string occurred_at_utc = 6;
  string producer = 7;
  bytes payload = 8;
}

message PlayerCreated {
  string player_id = 1;
  string name = 2;
  int32 attack = 3;
  int32 health = 4;
  int32 max_health = 5;
}

// A chest was opened by its owner in a dungeon run. Rewards owns the generated
// loot; Dungeon only supplies the stable cause and marks the chest opened.
message ChestOpened {
  string run_id = 1;
  string game_session_id = 2;
  string seed = 3;
  int32 floor = 4;
  int32 element_id = 5;
  string opened_at_utc = 6;
}
